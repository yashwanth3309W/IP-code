<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Seeker Registration</title>
<style>
  body { font-family: Arial, sans-serif; background: #f7f4f4; }
  .container { width: 500px; margin: 30px auto; background: rgb(255, 255, 255); padding: 24px; border-radius: 8px; box-shadow: 0px 0px 10px rgb(7, 5, 5); }
  h2 { text-align: center; color: rgb(6, 7, 7); }
  label { font-weight: bold; }
  input, select { width: 100%; padding: 8px; margin: 8px 0 5px; box-sizing: border-box; }
  input[type="submit"] { background: rgb(175, 167, 243); color: white; border: none; cursor: pointer; font-size: 16px; margin-top: 15px; }
  input[type="submit"]:hover { background: rgb(141, 248, 155); }
  .error { color: red; font-size: 13px; margin: 0 0 10px 0; height: 16px; }
</style>
</head>
<body>
<div class="container">
  <h2>JOB SEEKERS REGISTRATION FORM</h2>
  <form id="registrationForm" onsubmit="return validateForm()">
    <label>Full Name *</label>
    <input type="text" id="name">
    <div class="error" id="nameError"></div>

    <label>Email *</label>
    <input type="text" id="email">
    <div class="error" id="emailError"></div>

    <label>Phone Number *</label>
    <input type="text" id="phone" maxlength="10">
    <div class="error" id="phoneError"></div>

    <label>Password *</label>
    <input type="password" id="password">
    <div class="error" id="passwordError"></div>

    <label>Confirm Password *</label>
    <input type="password" id="confirmPassword">
    <div class="error" id="confirmPasswordError"></div>

    <label>Highest Qualification *</label>
    <select id="qualification">
      <option value="">Select</option>
      <option>B.E/B.Tech</option>
      <option>M.E/M.Tech</option>
      <option>B.Sc</option>
      <option>M.Sc</option>
      <option>MBA</option>
      <option>Others</option>
    </select>
    <div class="error" id="qualificationError"></div>

    <label>Skills</label>
    <select id="Skills">
      <option value="">Select</option>
      <option>Java</option>
      <option>C</option>
      <option>C++</option>
      <option>Python</option>
      <option>React</option>
      <option>Others</option>
    </select>
    <div class="error" id="skillsError"></div>

    <label>Years of Experience *</label>
    <input type="number" id="experience" min="0">
    <div class="error" id="experienceError"></div>

    <input type="submit" value="Register">
  </form>
</div>

<script>
function validateForm() {
  let name = document.getElementById("name").value.trim();
  let email = document.getElementById("email").value.trim();
  let phone = document.getElementById("phone").value.trim();
  let password = document.getElementById("password").value;
  let confirmPassword = document.getElementById("confirmPassword").value;
  let qualification = document.getElementById("qualification").value;
  let experience = document.getElementById("experience").value;

  // Clear previous error messages
  document.getElementById("nameError").innerHTML = "";
  document.getElementById("emailError").innerHTML = "";
  document.getElementById("phoneError").innerHTML = "";
  document.getElementById("passwordError").innerHTML = "";
  document.getElementById("confirmPasswordError").innerHTML = "";
  document.getElementById("qualificationError").innerHTML = "";
  document.getElementById("experienceError").innerHTML = "";

  let isValid = true;

  let namePattern = /^[A-Za-z ]+$/;
  if (name === "") {
    document.getElementById("nameError").innerHTML = "Full Name is required.";
    isValid = false;
  } else if (!namePattern.test(name)) {
    document.getElementById("nameError").innerHTML = "Name should contain only alphabets.";
    isValid = false;
  }

  let emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;
  if (email === "") {
    document.getElementById("emailError").innerHTML = "Email is required.";
    isValid = false;
  } else if (!emailPattern.test(email)) {
    document.getElementById("emailError").innerHTML = "Invalid email format.";
    isValid = false;
  }

  let phonePattern = /^[6-9][0-9]{9}$/;
  if (phone === "") {
    document.getElementById("phoneError").innerHTML = "Phone number is required.";
    isValid = false;
  } else if (!phonePattern.test(phone)) {
    document.getElementById("phoneError").innerHTML = "Enter a valid 10-digit phone number.";
    isValid = false;
  }

  if (password === "") {
    document.getElementById("passwordError").innerHTML = "Password is required.";
    isValid = false;
  } else if (password.length < 6) {
    document.getElementById("passwordError").innerHTML = "Password must be at least 6 characters.";
    isValid = false;
  }

  if (confirmPassword === "") {
    document.getElementById("confirmPasswordError").innerHTML = "Confirm your password.";
    isValid = false;
  } else if (password !== confirmPassword) {
    document.getElementById("confirmPasswordError").innerHTML = "Passwords do not match.";
    isValid = false;
  }

  if (qualification === "") {
    document.getElementById("qualificationError").innerHTML = "Please select a qualification.";
    isValid = false;
  }

  if (experience === "") {
    document.getElementById("experienceError").innerHTML = "Experience is required.";
    isValid = false;
  }

  if (isValid) {
    alert("Registration Successful!");
    return true;
  }
  
  return false;
}
</script>
</body>
</html>
